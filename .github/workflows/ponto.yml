name: Bater ponto automático

on:
  schedule:
    - cron: "0 10 * * 1-5"  # 07:19 BRT -> 10:19 UTC
    - cron: "45 19 * * 1-5"  # 17:07 BRT -> 20:07 UTC
  workflow_dispatch:

jobs:
  run-ponto:
    runs-on: ubuntu-latest

    env:
      APDATA_USERNAME: ${{ secrets.APDATA_USERNAME }}
      APDATA_PASSWORD: ${{ secrets.APDATA_PASSWORD }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Instalar Google Chrome / Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser || true

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script de ponto
        run: python Scripts/Main.py
