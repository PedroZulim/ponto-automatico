name: Bater ponto automático

# Este workflow funciona perfeitamente em repositórios privados!
# GitHub Actions está habilitado para repos privados com limites de minutos gratuitos.
# Para mais informações, consulte o README.md

on:
  schedule:
    - cron: "0 10 * * 1-5"  # 10:00 UTC = 07:00 BRT (antes da entrada às 07:22)
    - cron: "55 19 * * 1-5"  # 19:55 UTC = 16:55 BRT (antes da saída às 17:10)
  workflow_dispatch:

jobs:
  run-ponto:
    runs-on: ubuntu-latest

    env:
      APDATA_USERNAME: ${{ secrets.APDATA_USERNAME }}
      APDATA_PASSWORD: ${{ secrets.APDATA_PASSWORD }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Instalar Google Chrome / Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser || true

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script de ponto
        run: python Scripts/Main.py
