name: Bater ponto automático

on:
  schedule:
    # 08:00 e 18:00 horário de Brasília (UTC-3) -> 11:00 e 21:00 UTC
    - cron: "0 11 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

jobs:
  run-ponto:
    runs-on: ubuntu-latest

    env:
      APDATA_USERNAME: ${{ secrets.APDATA_USERNAME }}
      APDATA_PASSWORD: ${{ secrets.APDATA_PASSWORD }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Google Chrome / Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser || true

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script de ponto
        run: python Ponto.py
